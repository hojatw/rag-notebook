[pytest]
# 測試預設並行執行（pytest-xdist）。這個 suite 的耗時幾乎全來自每個測試重建
# app/DB 的固定成本，不是 CPU 密集運算，所以平行化是唯一不犧牲覆蓋率的加速手段：
# 471 個測試由單核 132 秒降到 8 個 worker 約 27 秒。
#
# `auto` 取機器核心數，`--maxprocesses=8` 是上限：本機 16 核實測 8 個 worker
# (27s) 比 16 個 (29s) 還快，worker 啟動與 SQLite/Chroma 的 I/O 競爭超過了多
# 出來的平行度。CI runner 只有 2-4 核，auto 會自己降到核心數，上限不影響它。
#
# 平行化安全的前提：每個測試都用 `tmp_path` 取得自己的 NOTEBOOKLM_DATA_DIR，
# 不共用 data/ 或 logs/。新增測試請維持這個前提，不要寫入固定路徑。
#
# 要序列執行（除錯、用 `-s` 看輸出、或進 pdb）時加 `-n0`：
#   .venv/bin/pytest -n0 -s tests/test_ui_auth.py::test_name
addopts = -n auto --maxprocesses=8
testpaths = tests
