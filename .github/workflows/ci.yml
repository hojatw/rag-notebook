name: CI

# Docs-only changes skip CI: no test reads a Markdown file, and main has no
# required status checks, so a skipped run cannot block a merge. If CI ever
# becomes a required check, switch to the always-run pattern described in
# docs/RELEASE.md -> CI, or docs-only PRs will wait forever for a check that
# never starts. A change touching any non-ignored file still runs the full job.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile Python files
        run: |
          python -m py_compile app/*.py tests/*.py

      - name: Run tests
        env:
          NOTEBOOKLM_SECRET: ci-test-secret
        run: |
          pytest -q
