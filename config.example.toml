# NotebookLM RAG POC — tunable configuration template.
#
# Copy to `config.toml` (gitignored) to override defaults, or point
# NOTEBOOKLM_CONFIG_FILE at any path. Every value below is the built-in default,
# so an empty/absent file changes nothing. Precedence (low -> high):
#   dataclass defaults  <  this TOML file  <  env vars NOTEBOOKLM_<GROUP>_<FIELD>
# e.g. NOTEBOOKLM_RETRIEVAL_VECTOR_WEIGHT=0.6 overrides [retrieval].vector_weight.
#
# Handy for eval sweeps:  NOTEBOOKLM_RETRIEVAL_VECTOR_WEIGHT=0.6 \
#                         .venv/bin/python -m tests.eval_retrieval
#
# Keep a tuned file per corpus/language as a deliverable (e.g. config.zh.toml).

# --- Retrieval / answer quality (the main Q1-3 tuning knobs) ----------------
[retrieval]
vector_weight = 0.7            # hybrid blend weight on the vector score
keyword_weight = 0.3          # hybrid blend weight on the keyword score
rerank_weight = 0.8           # rerank blend weight on the LLM rerank score
rerank_base_weight = 0.2      # rerank blend weight on the hybrid score
low_confidence_threshold = 0.25  # top score below this -> the answer abstains
candidate_pool_size = 20      # vector n_results / keyword limit / pre-rerank cap
final_chunk_count = 6         # chunks kept after rerank, fed to the answer
fallback_max_chunks = 2000    # cap on the degraded Chroma-down SQLite scan

# --- Chunking (CHANGING THESE REQUIRES RE-INDEXING existing sources) --------
[chunking]
latin_target_chars = 800      # target chunk size for Latin-script text
cjk_target_chars = 400        # target chunk size for CJK text (denser per char)
overlap_sentences = 1         # sentences of overlap between adjacent chunks

# --- A6c spreadsheet ingestion (docs/SPREADSHEET_INGESTION.md) --------------
# rows_per_chunk_max and embed_token_budget CHANGE CHUNK SHAPE -> re-index
# existing spreadsheet sources after touching them. The rest only affect what
# the next ingest reads/detects.
[spreadsheet]
max_rows = 5000               # per sheet, after the header row
max_cols = 60                 # per sheet
rows_per_chunk_max = 20       # upper bound on record-chunk packing
embed_token_budget = 400      # estimated tokens per record chunk
header_sample_rows = 5        # rows inspected when inferring a header
wide_sheet_cols = 25          # above this, warn that the sheet is wide
qa_question_synonyms = "question,q,問題,提問,問句,客戶提問"
qa_answer_synonyms = "answer,a,答案,回覆,回答,解答,回覆內容"

# --- E2 Notebook domain hints and answer policy -----------------------------
# Query-time only: changing these limits never requires re-indexing.
[domain_policy]
max_hints = 50
max_term_chars = 100
max_synonyms = 8
max_synonym_chars = 100
max_definition_chars = 300
max_query_expansions = 4
max_query_expansion_chars = 120
max_answer_note_chars = 300
max_policy_chars = 1000
max_policy_tokens = 800
max_matched_hints = 8
max_hint_tokens = 600
max_rewrite_queries = 5

# --- A6a ingestion diagnostics (display thresholds only, no re-indexing) -----
[diagnostics]
low_text_chars = 200          # extracted total below this -> "almost no text" warning
preview_chars = 500           # stored extracted-text preview length
embedding_token_budget = 512  # model input window used for the over-budget warning
cjk_chars_per_token = 1.0     # CJK-heavy estimate (conservative: 1 token per char)
latin_chars_per_token = 4.0   # Latin estimate (the usual ~4 chars per token)

# --- Embedding throughput (settings.* can still override per deployment) -----
[embedding]
batch_size = 64               # texts per embedding request
max_concurrency = 4           # in-flight embedding batches (bound the endpoint)

# --- LLM/embedding HTTP retry ------------------------------------------------
[llm_retry]
max_attempts = 3
backoff_base_s = 0.5          # exponential backoff base (seconds) + jitter

# --- Ingest job queue --------------------------------------------------------
[jobs]
visibility_timeout_s = 1800.0 # abandoned 'running' job becomes re-claimable
max_attempts = 3              # cap on (re)claims before a job is failed
poll_interval_s = 2.0         # worker idle poll interval

# --- Misc runtime ------------------------------------------------------------
[runtime]
briefing_lock_timeout_s = 90.0
index_migration_lock_timeout_s = 600.0   # O0: a stale dimension-migration lock is reclaimed after this
upload_batch_limit = 5        # max files per upload request
# Two file-size caps, named for the pipeline stage that enforces them:
upload_max_file_bytes = 50000000    # upload time, every format (protects disk + request memory)
extract_max_file_bytes = 20000000   # extract time, .xlsx/.pptx/.csv only (protects the parser)
# The upload path applies whichever is stricter for the file's format, so an
# oversized spreadsheet is refused up front rather than failing in the worker.
# (extract_max_file_bytes was named max_source_bytes before 0.4; the old key is
#  still read, with a deprecation warning.)
suggestions_ttl_hours = 24
briefing_ttl_hours = 24
# Characters buffered before the answer stream may show anything. 0 = buffer the
# whole answer before showing any of it (default, and the strongest form of the
# [[RAG_ABSTAIN]] guarantee: a model that abstains after a plausible preamble
# never puts a word on screen). A positive value turns on partial streaming.
# Only worth it if the provider really streams — Azure OpenAI buffers upstream
# and releases in one burst, so a gate gains ~0.2s there and gives up the
# guarantee for nothing. Check with `python -m tests.probe_provider_stream`
# first; if chunks are spread across the generation, 120 is the measured value.
# See docs/DEVELOPMENT.md.
answer_stream_gate_chars = 0

# --- UI / i18n ---------------------------------------------------------------
[ui]
language = "zh-TW"            # default UI locale; the i18n catalog falls back to this

# --- Authentication / enterprise SSO ----------------------------------------
[auth]
local_login_enabled = true
login_rate_limit_enabled = true
login_account_attempt_limit = 5       # failed attempts per normalized username
login_account_window_seconds = 900    # 15-minute account counting window
login_account_cooldown_seconds = 900  # block that username for 15 minutes
login_verification_max_concurrency = 4          # deployment-wide PBKDF2 leases
login_verification_lease_seconds = 30           # crash-safe lease expiry
login_verification_busy_retry_after_seconds = 1 # generic 429 Retry-After
session_max_age_hours = 12.0   # SEC-3: absolute session lifetime, not extended by activity
trusted_header_enabled = false
trusted_header_secret = ""    # required when trusted_header_enabled = true
trusted_header_secret_header = "X-NotebookLM-Auth-Secret"
trusted_header_user_header = "X-Forwarded-User"      # stable external subject
trusted_header_email_header = "X-Forwarded-Email"
trusted_header_name_header = "X-Forwarded-Name"
trusted_header_groups_header = "X-Forwarded-Groups" # comma/semicolon-separated
trusted_header_admin_groups = ""                    # e.g. "rag-admins,domain admins"
trusted_header_auto_provision = true
trusted_header_provider = "trusted_header"
trusted_header_allowed_ips = ""   # optional proxy source-IP allowlist (IP/CIDR, comma-separated); empty = secret-only. Matches request.client.host (TCP peer), never X-Forwarded-For.
oidc_enabled = false
oidc_provider = "oidc"        # external_identities.provider value
oidc_issuer = ""              # e.g. https://login.microsoftonline.com/<tenant-id>/v2.0
oidc_discovery_url = ""       # optional; defaults to <issuer>/.well-known/openid-configuration
oidc_client_id = ""
oidc_client_secret = ""       # keep in .env/config.toml only; never commit real secrets
oidc_scopes = "openid profile email"
oidc_redirect_path = "/auth/oidc/callback"
oidc_token_auth_method = "client_secret_basic" # or client_secret_post
oidc_email_claim = "email"
oidc_name_claim = "name"
oidc_groups_claim = "groups"
oidc_admin_groups = ""
oidc_auto_provision = true
oidc_allowed_algorithms = "RS256"

# --- LLM output caps (LLM-3) -------------------------------------------------
# Truncation limits, not length targets. Sized for zh-TW output (~1 token/char);
# replace with measured p95 x 1.5 from llm_usage_events once you have traffic.
[max_tokens]
settings_chat_probe = 128
settings_stream_probe = 128
settings_image_probe = 128
query_rewrite = 512
followups = 512
source_summary = 512
rerank = 768
starter_questions = 768
briefing = 768
translate_summary = 768
eval_judge = 1536
answer_stream = 2048
chat_completion = 2048
eval_answer = 2048
meeting_minutes = 3072
compare = 3072
artifact_study_guide = 3072
artifact_faq = 3072
artifact_timeline = 3072
eval_authoring = 3072
default = 2048
